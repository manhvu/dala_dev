name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          # Baseline supported versions
          - elixir: "1.18"
            otp: "27"
          # OTP 28 removed :re.import — catches compile-time regex regressions
          # (see AGENTS.md gotcha #1) before they reach users.
          - elixir: "1.19"
            otp: "28"
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Credo
        run: mix credo --strict

      - name: Security audit
        run: mix deps.audit

      - name: Run tests
        run: mix test --exclude integration

      - name: Coverage
        run: mix coveralls
        continue-on-error: true
